<!DOCTYPE html>
<html>
<head>
    <title>HA SQLite Manager</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #1c1c1c; color: #e0e0e0; }
        h1 { color: #03a9f4; }
        a { color: #03a9f4; text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .menu-section { margin-bottom: 2rem; }
        .menu-section h2 { color: #999; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
        .button-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .nav-button {
            background: #2d2d2d; border-radius: 8px; padding: 1.25rem;
            color: #e0e0e0; border: 1px solid #444; font-size: 1rem;
            transition: border-color 0.2s; cursor: pointer; text-align: center;
        }
        .nav-button:hover { border-color: #03a9f4; }
        .table-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .table-card {
            background: #2d2d2d; border-radius: 8px; padding: 1rem;
            color: #e0e0e0; border: 1px solid #444;
            transition: border-color 0.2s; cursor: pointer;
        }
        .table-card:hover { border-color: #03a9f4; }
        .table-card h3 { margin: 0; color: #03a9f4; }
        .info { color: #999; margin-bottom: 1rem; }
        .loading { display: flex; align-items: center; gap: 0.75rem; padding: 2rem 0; color: #999; }
        .spinner {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid #444; border-top-color: #03a9f4;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
        th, td { border: 1px solid #444; padding: 0.4rem 0.6rem; text-align: left; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { background: #333; position: sticky; top: 0; }
        tr:hover { background: #2a2a2a; }
        .pagination { margin: 1rem 0; display: flex; gap: 0.5rem; align-items: center; }
        .pagination button {
            padding: 0.4rem 0.8rem; border-radius: 4px; background: #333;
            border: 1px solid #555; color: #e0e0e0; cursor: pointer;
        }
        .pagination button:hover { border-color: #03a9f4; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination span { padding: 0.4rem 0.8rem; border-radius: 4px; background: #03a9f4; color: #000; }
        .container { overflow-x: auto; }
        #back { margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div id="back"><a onclick="goBack()">&larr; Back</a></div>
    <h1 id="title">HA SQLite Manager</h1>
    <div id="content"></div>

    <script>
        const basePath = location.pathname.replace(/\/$/, '');
        let backAction = null;

        async function api(path) {
            const resp = await fetch(basePath + path);
            return resp.json();
        }

        function goBack() {
            if (backAction) backAction();
        }

        function setBack(action) {
            backAction = action;
            document.getElementById('back').style.display = action ? 'block' : 'none';
        }

        function showLoading() {
            document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
        }

        async function showHome() {
            setBack(null);
            document.getElementById('title').textContent = 'HA SQLite Manager';

            let html = '<div class="menu-section"><h2>Top-Usage</h2><div class="button-grid">';
            html += `<button class="nav-button" onclick="showStates()">States</button>`;
            html += `<button class="nav-button" onclick="alert('Statistics - coming soon')">Statistics</button>`;
            html += `<button class="nav-button" onclick="alert('Events - coming soon')">Events</button>`;
            html += '</div></div>';

            html += '<div class="menu-section"><h2>Tables</h2><div class="button-grid">';
            html += `<button class="nav-button" onclick="showTables()">All Tables</button>`;
            html += '</div></div>';

            document.getElementById('content').innerHTML = html;
        }

        let statesData = [];
        let statesSortKey = 'entity_id';
        let statesSortDir = 'asc';

        async function showStates() {
            setBack(showHome);
            document.getElementById('title').textContent = 'States';
            showLoading();
            statesData = await api('/api/states');
            renderStates();
        }

        function sortStates(key) {
            if (statesSortKey === key) {
                statesSortDir = statesSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                statesSortKey = key;
                statesSortDir = 'asc';
            }
            renderStates();
        }

        function renderStates() {
            const columns = [
                { key: 'entity_id', label: 'entity_id' },
                { key: 'metadata_id', label: 'metadata_id' },
                { key: 'state_count', label: 'state_count' }
            ];

            const sorted = [...statesData].sort((a, b) => {
                const va = a[statesSortKey];
                const vb = b[statesSortKey];
                const dir = statesSortDir === 'asc' ? 1 : -1;
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
                return String(va ?? '').localeCompare(String(vb ?? '')) * dir;
            });

            const arrow = statesSortDir === 'asc' ? ' &#9650;' : ' &#9660;';
            const thead = columns.map(c =>
                `<th style="cursor:pointer" onclick="sortStates('${c.key}')">${c.label}${statesSortKey === c.key ? arrow : ''}</th>`
            ).join('');

            const html = '<div class="container"><table><thead><tr>' + thead + '</tr></thead><tbody>' +
                sorted.map(e => `<tr><td><a onclick="showEntityStates('${e.entity_id}', 1)">${e.entity_id}</a></td><td>${e.metadata_id}</td><td>${e.state_count}</td></tr>`).join('') +
                '</tbody></table></div>';

            document.getElementById('content').innerHTML = `<div class="info">${statesData.length} entities</div>` + html;
        }

        async function showTables() {
            setBack(showHome);
            document.getElementById('title').textContent = 'All Tables';
            showLoading();
            const tables = await api('/api/tables');
            const html = '<div class="table-list">' +
                tables.map(t => `<div class="table-card" onclick="showTable('${t}', 1)"><h3>${t}</h3></div>`).join('') +
                '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function paginationHtml(data, pageCall) {
            return '<div class="pagination">' +
                `<button onclick="${pageCall(data.page - 1)}" ${data.page <= 1 ? 'disabled' : ''}>&laquo; Prev</button>` +
                `<span>${data.page}</span>` +
                `<button onclick="${pageCall(data.page + 1)}" ${data.page >= data.total_pages ? 'disabled' : ''}>Next &raquo;</button>` +
                '</div>';
        }

        function renderTablePage(data, pageCall) {
            let html = `<div class="info">${data.total_rows} rows total | Page ${data.page} of ${data.total_pages}</div>`;
            html += paginationHtml(data, pageCall);

            html += '<div class="container"><table><thead><tr>';
            data.columns.forEach(c => html += `<th>${c}</th>`);
            html += '</tr></thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                data.columns.forEach(c => {
                    const val = row[c] !== null ? row[c] : '';
                    html += `<td title="${String(val).replace(/"/g, '&quot;')}">${val}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';

            html += paginationHtml(data, pageCall);
            document.getElementById('content').innerHTML = html;
        }

        async function showTable(name, page) {
            setBack(showTables);
            document.getElementById('title').textContent = name;
            showLoading();
            const data = await api(`/api/table/${encodeURIComponent(name)}?page=${page}&page_size=100`);
            renderTablePage(data, p => `showTable('${name}', ${p})`);
        }

        async function showEntityStates(entity_id, page) {
            setBack(showStates);
            document.getElementById('title').textContent = entity_id;
            showLoading();
            const data = await api(`/api/entity/${encodeURIComponent(entity_id)}/states?page=${page}&page_size=100`);
            renderTablePage(data, p => `showEntityStates('${entity_id}', ${p})`);
        }

        showHome();
    </script>
</body>
</html>

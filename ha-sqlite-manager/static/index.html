<!DOCTYPE html>
<html>
<head>
    <title>HA SQLite Manager</title>
    <style>
        :root {
            --app-bg: #1c1c1c;
            --app-text: #e0e0e0;
            --app-text-secondary: #999;
            --app-accent: #03a9f4;
            --app-accent-text: #000;
            --app-card-bg: #2d2d2d;
            --app-card-bg-hover: #2a2a2a;
            --app-header-bg: #333;
            --app-border: #444;
            --app-border-strong: #555;
        }
        body { font-family: system-ui, sans-serif; margin: 2rem; background: var(--app-bg); color: var(--app-text); }
        h1 { color: var(--app-accent); }
        a { color: var(--app-accent); text-decoration: none; cursor: pointer; }
        a:hover { text-decoration: underline; }
        .menu-section { margin-bottom: 2rem; }
        .menu-section h2 { color: var(--app-text-secondary); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
        .button-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .nav-button {
            background: var(--app-card-bg); border-radius: 8px; padding: 1.25rem;
            color: var(--app-text); border: 1px solid var(--app-border); font-size: 1rem;
            transition: border-color 0.2s; cursor: pointer; text-align: center;
        }
        .nav-button:hover { border-color: var(--app-accent); }
        .table-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .table-card {
            background: var(--app-card-bg); border-radius: 8px; padding: 1rem;
            color: var(--app-text); border: 1px solid var(--app-border);
            transition: border-color 0.2s; cursor: pointer;
        }
        .table-card:hover { border-color: var(--app-accent); }
        .table-card h3 { margin: 0; color: var(--app-accent); }
        .info { color: var(--app-text-secondary); margin-bottom: 1rem; }
        .loading { display: flex; align-items: center; gap: 0.75rem; padding: 2rem 0; color: var(--app-text-secondary); }
        .spinner {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid var(--app-border); border-top-color: var(--app-accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
        th, td { border: 1px solid var(--app-border); padding: 0.4rem 0.6rem; text-align: left; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { background: var(--app-header-bg); position: sticky; top: 0; }
        tr:hover { background: var(--app-card-bg-hover); }
        .pagination { margin: 1rem 0; display: flex; gap: 0.5rem; align-items: center; }
        .pagination button {
            padding: 0.4rem 0.8rem; border-radius: 4px; background: var(--app-header-bg);
            border: 1px solid var(--app-border-strong); color: var(--app-text); cursor: pointer;
        }
        .pagination button:hover { border-color: var(--app-accent); }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination span { padding: 0.4rem 0.8rem; border-radius: 4px; background: var(--app-accent); color: var(--app-accent-text); }
        .container { overflow-x: auto; }
        .settings { max-width: 40rem; padding: 0.5rem 0; }
        .settings-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .settings-row label { font-weight: bold; }
        .settings-row select {
            padding: 0.4rem 0.6rem; border-radius: 4px;
            background: var(--app-header-bg); border: 1px solid var(--app-border-strong); color: var(--app-text);
        }
        #back { margin-bottom: 1rem; display: none; }
        #ts-toggle {
            position: fixed; top: 0.75rem; right: 0.75rem; z-index: 999;
            padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer;
            background: var(--app-header-bg); border: 1px solid var(--app-border-strong); color: var(--app-text);
        }
        #ts-toggle:hover { border-color: var(--app-accent); }
    </style>
</head>
<body>
    <button id="ts-toggle" onclick="toggleTsMode()">Timestamps: Human</button>
    <div id="back"><a onclick="goBack()">&larr; Back</a></div>
    <h1 id="title">HA SQLite Manager</h1>
    <div id="content"></div>
    <pre id="theme-debug" style="position:fixed;top:4px;right:4px;z-index:9999;max-width:340px;max-height:40vh;overflow:auto;margin:0;padding:6px;background:rgba(0,0,0,0.85);color:#0f0;font-size:10px;line-height:1.3;white-space:pre-wrap;display:none"></pre>

    <script>
        const basePath = location.pathname.replace(/\/$/, '');
        let backAction = null;

        const themeMap = {
            '--app-accent': '--primary-color',
            '--app-accent-text': '--text-primary-color',
            '--app-bg': '--primary-background-color',
            '--app-text': '--primary-text-color',
            '--app-text-secondary': '--secondary-text-color',
            '--app-card-bg': '--card-background-color',
            '--app-card-bg-hover': '--card-background-color',
            '--app-header-bg': '--card-background-color',
            '--app-border': '--divider-color',
            '--app-border-strong': '--divider-color'
        };

        const debugEl = document.getElementById('theme-debug');
        let debugEnabled = false;
        function debug(msg) {
            console.log('[theme]', msg);
            if (debugEnabled && debugEl) {
                debugEl.textContent += msg + '\n';
            }
        }
        function toggleDebug() {
            debugEnabled = !debugEnabled;
            debugEl.style.display = debugEnabled ? 'block' : 'none';
            debugEl.textContent = 'DBG-v5 app=v' + '__APP_VERSION__' + '\n';
            if (debugEnabled) applyTheme();
        }
        document.getElementById('title').addEventListener('click', toggleDebug);

        function readVar(parentDoc, name) {
            try {
                const inline = parentDoc.documentElement.style.getPropertyValue(name).trim();
                debug(`readVar(${name}) inline -> '${inline}'`);
                if (inline) return inline;
                const el = parentDoc.createElement('div');
                el.style.cssText = 'position:fixed;color:var(' + name + ', inherit);';
                parentDoc.body.appendChild(el);
                const val = getComputedStyle(el).color;
                el.remove();
                debug(`readVar(${name}) computed -> '${val}'`);
                return val && val !== 'rgba(0, 0, 0, 0)' ? val : '';
            } catch (e) {
                debug(`readVar(${name}) error: ${e.message}`);
                return '';
            }
        }

        function applyTheme() {
            debug('applyTheme() called');
            if (window.parent === window) {
                debug('no parent (direct access), skip');
                return;
            }
            const root = document.documentElement;
            try {
                const parentDoc = window.parent.document;
                debug(`parent inline style props: ${parentDoc.documentElement.style.length}`);
                debug(`parent cssText prefix: ${parentDoc.documentElement.style.cssText.slice(0, 200)}`);
                const ha = parentDoc.querySelector('home-assistant');
                debug(`home-assistant: ${ha ? 'found' : 'NOT found'}`);
                if (ha) {
                    debug(`ha.hass present: ${!!ha.hass}`);
                    if (ha.hass) {
                        debug(`selectedTheme: ${JSON.stringify(ha.hass.selectedTheme)}`);
                        const themes = ha.hass.themes;
                        debug(`themes.darkMode: ${themes ? themes.darkMode : 'n/a'}, themes registry: ${themes ? Object.keys(themes.themes || {}).length : 'n/a'}`);
                    }
                }
                let applied = 0;
                for (const [target, sourceVar] of Object.entries(themeMap)) {
                    const val = readVar(parentDoc, sourceVar);
                    if (val) {
                        root.style.setProperty(target, val);
                        applied++;
                    }
                }
                debug(`applied ${applied}/${Object.keys(themeMap).length} vars`);
            } catch (e) {
                console.error('Could not apply HA theme:', e);
                debug('applyTheme error: ' + e.message);
            }
        }

        applyTheme();
        setInterval(applyTheme, 1000);

        async function api(path) {
            const resp = await fetch(basePath + path);
            return resp.json();
        }

        function goBack() {
            if (backAction) backAction();
        }

        function setBack(action) {
            backAction = action;
            document.getElementById('back').style.display = action ? 'block' : 'none';
        }

        function showLoading() {
            document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
        }

        async function showHome() {
            setBack(null);
            document.getElementById('title').textContent = 'HA SQLite Manager';

            let html = '<div class="menu-section"><h2>Top-Usage</h2><div class="button-grid">';
            html += `<button class="nav-button" onclick="showUsageView('States', statesConfig)">States</button>`;
            html += `<button class="nav-button" onclick="showUsageView('Statistics', statisticsConfig)">Statistics</button>`;
            html += `<button class="nav-button" onclick="showUsageView('Events', eventsConfig)">Events</button>`;
            html += '</div></div>';

            html += '<div class="menu-section"><h2>Tables</h2><div class="button-grid">';
            html += `<button class="nav-button" onclick="showTables()">All Tables</button>`;
            html += '</div></div>';

            html += '<div class="menu-section"><h2>Settings</h2><div class="button-grid">';
            html += `<button class="nav-button" onclick="showSettings()">Settings</button>`;
            html += '</div></div>';

            document.getElementById('content').innerHTML = html;
        }

        let usageData = [];
        let usageConfig = null;
        let usageSortKey = null;
        let usageSortDir = 'asc';

        const statesConfig = {
            listEndpoint: '/api/states',
            label: 'entities',
            sortKey: 'entity_id',
            columns: [
                { key: 'entity_id', label: 'entity_id', click: v => `showEntityStates('${v}', 1)` },
                { key: 'metadata_id', label: 'metadata_id' },
                { key: 'state_count', label: 'state_count' }
            ]
        };

        const statisticsConfig = {
            listEndpoint: '/api/statistics',
            label: 'statistics',
            sortKey: 'statistic_id',
            columns: [
                { key: 'statistic_id', label: 'statistic_id', click: v => `showStatisticData('${v}', 1)` },
                { key: 'metadata_id', label: 'metadata_id' },
                { key: 'stat_count', label: 'stat_count' }
            ]
        };

        const eventsConfig = {
            listEndpoint: '/api/event-types',
            label: 'event types',
            sortKey: 'event_type',
            columns: [
                { key: 'event_type', label: 'event_type', click: v => `showEventTypeData('${v}', 1)` },
                { key: 'event_type_id', label: 'event_type_id' },
                { key: 'event_count', label: 'event_count' }
            ]
        };

        async function showUsageView(title, config) {
            setBack(showHome);
            document.getElementById('title').textContent = title;
            showLoading();
            usageData = await api(config.listEndpoint);
            usageConfig = config;
            usageSortKey = config.sortKey;
            usageSortDir = 'asc';
            renderUsage();
        }

        function sortUsage(key) {
            if (usageSortKey === key) {
                usageSortDir = usageSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                usageSortKey = key;
                usageSortDir = 'asc';
            }
            renderUsage();
        }

        function renderUsage() {
            const columns = usageConfig.columns;
            const sorted = [...usageData].sort((a, b) => {
                const va = a[usageSortKey];
                const vb = b[usageSortKey];
                const dir = usageSortDir === 'asc' ? 1 : -1;
                if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
                return String(va ?? '').localeCompare(String(vb ?? '')) * dir;
            });

            const arrow = usageSortDir === 'asc' ? ' &#9650;' : ' &#9660;';
            const thead = columns.map(c =>
                `<th style="cursor:pointer" onclick="sortUsage('${c.key}')">${c.label}${usageSortKey === c.key ? arrow : ''}</th>`
            ).join('');

            const rows = sorted.map(e => {
                let cells = '';
                for (const c of columns) {
                    const val = e[c.key];
                    if (c.click && val != null) {
                        cells += `<td><a onclick="${c.click(val)}">${val}</a></td>`;
                    } else {
                        cells += `<td>${val != null ? val : ''}</td>`;
                    }
                }
                return '<tr>' + cells + '</tr>';
            }).join('');

            document.getElementById('content').innerHTML =
                `<div class="info">${usageData.length} ${usageConfig.label}</div>` +
                '<div class="container"><table><thead><tr>' + thead + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        }

        async function showTables() {
            setBack(showHome);
            document.getElementById('title').textContent = 'All Tables';
            showLoading();
            const tables = await api('/api/tables');
            const html = '<div class="table-list">' +
                tables.map(t => `<div class="table-card" onclick="showTable('${t}', 1)"><h3>${t}</h3></div>`).join('') +
                '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function paginationHtml(data, pageCall) {
            return '<div class="pagination">' +
                `<button onclick="${pageCall(data.page - 1)}" ${data.page <= 1 ? 'disabled' : ''}>&laquo; Prev</button>` +
                `<span>${data.page}</span>` +
                `<button onclick="${pageCall(data.page + 1)}" ${data.page >= data.total_pages ? 'disabled' : ''}>Next &raquo;</button>` +
                '</div>';
        }

        function renderTablePage(data, pageCall, sort, sortAction) {
            lastTable = { data, pageCall };
            let html = `<div class="info">${data.total_rows} rows total | Page ${data.page} of ${data.total_pages}</div>`;
            html += paginationHtml(data, pageCall);

            html += '<div class="container"><table><thead><tr>';
            data.columns.forEach(c => {
                const isSorted = sort && sort.key === c;
                const arrow = isSorted ? (sort.dir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
                const onclick = sortAction
                    ? `onclick="${sortAction(c, isSorted && sort.dir === 'asc' ? 'desc' : 'asc')}"`
                    : '';
                html += `<th style="cursor:pointer" ${onclick}>${c}${arrow}</th>`;
            });
            html += '</tr></thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                data.columns.forEach(c => {
                    const raw = row[c] !== null ? row[c] : '';
                    const display = c.endsWith('_ts') ? formatTs(raw) : raw;
                    html += `<td title="${String(raw).replace(/"/g, '&quot;')}">${display}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';

            html += paginationHtml(data, pageCall);
            document.getElementById('content').innerHTML = html;
        }

        let tsMode = 'human';
        let lastTable = null;
        let tsLocale = localStorage.getItem('tsLocale') || 'local';

        const localeOptions = [
            { value: 'local', label: 'Local (Browser default)' },
            { value: 'de-DE', label: 'Deutsch (de-DE)' },
            { value: 'en-US', label: 'English (US)' },
            { value: 'en-GB', label: 'English (UK)' },
            { value: 'fr-FR', label: 'Français (fr-FR)' },
            { value: 'es-ES', label: 'Español (es-ES)' },
            { value: 'it-IT', label: 'Italiano (it-IT)' },
            { value: 'nl-NL', label: 'Nederlands (nl-NL)' },
            { value: 'pt-BR', label: 'Português (BR)' },
            { value: 'pl-PL', label: 'Polski (pl-PL)' }
        ];

        function showSettings() {
            setBack(showHome);
            document.getElementById('title').textContent = 'Settings';
            const opts = localeOptions.map(o =>
                `<option value="${o.value}" ${o.value === tsLocale ? 'selected' : ''}>${o.label}</option>`
            ).join('');
            document.getElementById('content').innerHTML =
                '<div class="container"><div class="settings">' +
                '<div class="settings-row">' +
                '<label for="ts-locale">Timestamp format:</label>' +
                `<select id="ts-locale">${opts}</select>` +
                '</div>' +
                `<div class="info">Local uses your browser's language. The other options force a specific language, e.g. Deutsch = "01.08.2026, 12:30:00", US = "8/1/2026, 12:30:00 PM".</div>` +
                '</div></div>';
            document.getElementById('ts-locale').addEventListener('change', e => {
                tsLocale = e.target.value;
                localStorage.setItem('tsLocale', tsLocale);
                if (lastTable) renderTablePage(lastTable.data, lastTable.pageCall);
            });
        }

        function toggleTsMode() {
            tsMode = tsMode === 'human' ? 'raw' : 'human';
            document.getElementById('ts-toggle').textContent =
                tsMode === 'human' ? 'Timestamps: Human' : 'Timestamps: Raw';
            if (lastTable) renderTablePage(lastTable.data, lastTable.pageCall);
        }

        function formatTs(val) {
            if (tsMode !== 'human' || val === '') return val;
            const n = Number(val);
            if (!isFinite(n) || n === 0) return val;
            try {
                const locale = tsLocale === 'local' ? undefined : tsLocale;
                return new Date(n * 1000).toLocaleString(locale, {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            } catch (e) {
                return val;
            }
        }

        async function showTable(name, page, sortKey, sortDir) {
            setBack(showTables);
            document.getElementById('title').textContent = name;
            showLoading();
            const qs = new URLSearchParams({ page, page_size: 100 });
            if (sortKey && sortDir) { qs.set('sort', sortKey); qs.set('dir', sortDir); }
            const data = await api(`/api/table/${encodeURIComponent(name)}?${qs}`);
            const sort = sortKey && sortDir ? { key: sortKey, dir: sortDir } : null;
            renderTablePage(
                data,
                p => `showTable('${name}', ${p}, '${sortKey || ''}', '${sortDir || ''}')`,
                sort,
                (k, d) => `showTable('${name}', 1, '${k}', '${d}')`
            );
        }

        async function showEntityStates(entity_id, page, sortKey, sortDir) {
            setBack(() => showUsageView('States', statesConfig));
            document.getElementById('title').textContent = entity_id;
            showLoading();
            const qs = new URLSearchParams({ page, page_size: 100 });
            if (sortKey && sortDir) { qs.set('sort', sortKey); qs.set('dir', sortDir); }
            const data = await api(`/api/entity/${encodeURIComponent(entity_id)}/states?${qs}`);
            const sort = sortKey && sortDir ? { key: sortKey, dir: sortDir } : null;
            renderTablePage(
                data,
                p => `showEntityStates('${entity_id}', ${p}, '${sortKey || ''}', '${sortDir || ''}')`,
                sort,
                (k, d) => `showEntityStates('${entity_id}', 1, '${k}', '${d}')`
            );
        }

        async function showStatisticData(statistic_id, page, sortKey, sortDir) {
            setBack(() => showUsageView('Statistics', statisticsConfig));
            document.getElementById('title').textContent = statistic_id;
            showLoading();
            const qs = new URLSearchParams({ page, page_size: 100 });
            if (sortKey && sortDir) { qs.set('sort', sortKey); qs.set('dir', sortDir); }
            const data = await api(`/api/statistic/${encodeURIComponent(statistic_id)}/data?${qs}`);
            const sort = sortKey && sortDir ? { key: sortKey, dir: sortDir } : null;
            renderTablePage(
                data,
                p => `showStatisticData('${statistic_id}', ${p}, '${sortKey || ''}', '${sortDir || ''}')`,
                sort,
                (k, d) => `showStatisticData('${statistic_id}', 1, '${k}', '${d}')`
            );
        }

        async function showEventTypeData(event_type, page, sortKey, sortDir) {
            setBack(() => showUsageView('Events', eventsConfig));
            document.getElementById('title').textContent = event_type;
            showLoading();
            const qs = new URLSearchParams({ page, page_size: 100 });
            if (sortKey && sortDir) { qs.set('sort', sortKey); qs.set('dir', sortDir); }
            const data = await api(`/api/event-type/${encodeURIComponent(event_type)}/data?${qs}`);
            const sort = sortKey && sortDir ? { key: sortKey, dir: sortDir } : null;
            renderTablePage(
                data,
                p => `showEventTypeData('${event_type}', ${p}, '${sortKey || ''}', '${sortDir || ''}')`,
                sort,
                (k, d) => `showEventTypeData('${event_type}', 1, '${k}', '${d}')`
            );
        }

        showHome();
    </script>
</body>
</html>

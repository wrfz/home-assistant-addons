<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Home Assistant DB Manager</title>
    <link rel="stylesheet" href="static/style.css?v=__APP_VERSION__">
</head>
<body>
    <header class="app-header">
        <div class="title-row">
            <h1 id="title">Home Assistant DB Manager</h1>
            <span id="title-progress" class="title-progress hidden"></span>
        </div>
        <div id="top-buttons">
            <button class="top-btn" id="live-toggle" onclick="toggleLive()">Live: Off</button>
            <button class="top-btn" onclick="refresh()">&#8635; Refresh</button>
            <button class="top-btn" id="clean-new" onclick="cleanNew()" style="display:none">Clean New</button>
            <button class="top-btn" id="ts-toggle" onclick="toggleTsMode()">Timestamps: Human</button>
        </div>
    </header>
    <div id="back"><a onclick="goBack()">&larr; Back</a></div>
    <div id="content"></div>
    <div id="debug-panel">
        <div id="debug-title">Debug</div>
        <pre id="theme-debug"></pre>
    </div>

    <script type="module" src="static/app.js?v=__APP_VERSION__"></script>
</body>
</html>
